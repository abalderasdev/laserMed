<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · No encontramos esa página · LaserMed</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #f5f1ea; --ink: #1a1815; --ink-2: #5c574f; --accent: #c9603d; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap {
      text-align: center;
      max-width: 560px;
    }
    .num {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(120px, 22vw, 200px);
      line-height: 0.9;
      font-weight: 400;
      color: var(--accent);
      font-style: italic;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.015em;
      margin-bottom: 16px;
    }
    .h-italic { font-style: italic; color: var(--accent); }
    p {
      color: var(--ink-2);
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .ctas {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 300ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn--primary { background: var(--accent); color: #f8f5ef; }
    .btn--primary:hover { background: #a84d2c; transform: translateY(-1px); }
    .btn--ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
    .btn--ghost:hover { background: var(--ink); color: #f8f5ef; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="num">404</div>
    <h1>Esta página<br />no <span class="h-italic">existe</span>.</h1>
    <p>Quizá se movió, o el link llegó mal. Lo que sí existe es LaserMed, y está esperándote.</p>
    <div class="ctas">
      <a href="/" class="btn btn--primary">Volver al inicio</a>
      <a href="/docs" class="btn btn--ghost">Ver documentación</a>
    </div>
  </main>
</body>
</html>
